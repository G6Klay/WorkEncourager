<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>core tests</title>
<script src="../web/core.js"></script>
</head>
<body>
<pre id="result">running</pre>
<script>
const C = window.Core;
const results = [];

function test(name, fn) {
  try { fn(); results.push(`PASS ${name}`); }
  catch (e) { results.push(`FAIL ${name}: ${e.message}`); }
}
function eq(actual, expected, label) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error(`${label || ''} expected ${b}, got ${a}`);
}
function near(actual, expected, label, tol = 0.001) {
  if (Math.abs(actual - expected) > tol) throw new Error(`${label || ''} expected ${expected}, got ${actual}`);
}
const at = (y, mo, d, h = 0, mi = 0, s = 0) => new Date(y, mo - 1, d, h, mi, s).getTime();

/* 2026 年 11 月：1 日是周日，共 21 个工作日。11 月 5 日是周四。 */
const BASE = at(2026, 11, 1);
function make(patch) {
  const s = C.defaultState(BASE);
  s.salary.monthly = 8000;
  // 下面大部分用例验证的是没有午休时的基础算法，午休有单独的用例。
  s.schedule.shifts[0].breakStart = null;
  s.schedule.shifts[0].breakEnd = null;
  return Object.assign(s, patch || {});
}
/* 09:00–18:00，午休 12:00–13:00，计薪工时 8 小时。 */
function makeLunch(patch) {
  const s = make(patch);
  s.schedule.shifts[0].breakStart = '12:00';
  s.schedule.shifts[0].breakEnd = '13:00';
  return s;
}
const wage = 8000 / 21;
const hourly8 = wage / 8;

test('按周：月薪按当月排班天数折算日薪', () => {
  const s = make();
  eq(C.workDayCount(s.schedule, 2026, 10), 21);
  near(C.dailyWage(s, new Date(2026, 10, 5)), wage);
});

test('按周：不同月份天数不同，日薪随之变化', () => {
  const s = make();
  // 2026 年 12 月有 23 个工作日
  eq(C.workDayCount(s.schedule, 2026, 11), 23);
  near(C.dailyWage(s, new Date(2026, 11, 1)), 8000 / 23);
});

test('按周：只上周二和周六也能算', () => {
  const s = make();
  s.schedule.weekly = { 2: 'day', 6: 'day' };
  eq(C.workDayCount(s.schedule, 2026, 10), 8);
  near(C.dailyWage(s, new Date(2026, 10, 3)), 1000);
  eq(C.getStatus(s, at(2026, 11, 5, 10)).kind, 'rest');
  eq(C.getStatus(s, at(2026, 11, 3, 10)).kind, 'working');
});

test('按月：只有手选的日期算上班，并按手选天数折算', () => {
  const s = make();
  s.schedule.mode = 'monthly';
  [3, 7, 12, 20].forEach((d) => C.toggleDay(s, new Date(2026, 10, d), 'day'));
  eq(C.workDayCount(s.schedule, 2026, 10), 4);
  near(C.dailyWage(s, new Date(2026, 10, 3)), 2000);
  eq(C.getStatus(s, at(2026, 11, 7, 10)).kind, 'working');
  eq(C.getStatus(s, at(2026, 11, 8, 10)).kind, 'rest');
  C.toggleDay(s, new Date(2026, 10, 7), 'day');
  eq(C.workDayCount(s.schedule, 2026, 10), 3);
});

test('按月：下个月没排班时不算上班', () => {
  const s = make();
  s.schedule.mode = 'monthly';
  C.toggleDay(s, new Date(2026, 10, 3), 'day');
  eq(C.workDayCount(s.schedule, 2026, 11), 0);
  eq(C.dailyWage(s, new Date(2026, 11, 3)), 0);
});

test('固定 21.75 天算法', () => {
  const s = make();
  s.salary.divisor = 'legal';
  near(C.dailyWage(s, new Date(2026, 10, 5)), 8000 / 21.75);
});

test('周模式的单日例外：请假和加班日都计入当月天数', () => {
  const s = make();
  C.toggleDay(s, new Date(2026, 10, 5), 'day');
  eq(s.schedule.exceptions['2026-11-05'], 'off');
  eq(C.workDayCount(s.schedule, 2026, 10), 20);
  eq(C.getStatus(s, at(2026, 11, 5, 10)).kind, 'rest');
  C.toggleDay(s, new Date(2026, 10, 5), 'day');
  eq(s.schedule.exceptions['2026-11-05'], undefined);
  C.toggleDay(s, new Date(2026, 10, 7), 'day');
  eq(C.workDayCount(s.schedule, 2026, 10), 22);
  eq(C.getStatus(s, at(2026, 11, 7, 10)).kind, 'working');
});

test('状态随时间自动切换：上班前、工作中、到点待结算', () => {
  const s = make();
  const before = C.getStatus(s, at(2026, 11, 5, 8, 30));
  eq(before.kind, 'before');
  eq(before.target, at(2026, 11, 5, 9));
  const mid = C.getStatus(s, at(2026, 11, 5, 13, 30));
  eq(mid.kind, 'working');
  near(mid.earn.total, wage / 2);
  near(mid.progress, 0.5);
  eq(mid.target, at(2026, 11, 5, 18));
  eq(C.getStatus(s, at(2026, 11, 5, 17, 59, 59)).kind, 'working');
  eq(C.getStatus(s, at(2026, 11, 5, 18)).kind, 'overtime');
});

test('到下班时间不会自动结算，要等手动点', () => {
  const s = make();
  s.processedFrom = '2026-11-05';
  const later = at(2026, 11, 5, 20);
  eq(C.autoSettle(s, later).length, 0);
  eq(C.getStatus(s, later).kind, 'overtime');
  eq(s.records['2026-11-05'], undefined);
});

test('每秒都在涨：相邻两秒的差等于每秒费率', () => {
  const s = make();
  const a = C.getStatus(s, at(2026, 11, 5, 10, 0, 0));
  const b = C.getStatus(s, at(2026, 11, 5, 10, 0, 1));
  near(b.earn.total - a.earn.total, wage / (9 * 3600), 'per second', 1e-9);
});

test('加班费三种模式', () => {
  const t = at(2026, 11, 5, 19);
  const s = make();
  near(C.getStatus(s, t).earn.overtime, (wage / 9) * 1.5, 'multiplier');
  s.overtime.mode = 'fixed';
  s.overtime.hourly = 50;
  near(C.getStatus(s, t).earn.overtime, 50, 'fixed');
  s.overtime.mode = 'none';
  near(C.getStatus(s, t).earn.overtime, 0, 'none');
  near(C.getStatus(s, t).earn.total, wage, 'none total');
});

test('手动下班：写入记录、变成已结算、不能重复结算', () => {
  const s = make();
  s.overtime.mode = 'none';
  const t = at(2026, 11, 5, 18, 30);
  const res = C.clockOut(s, t);
  near(res.record.total, wage);
  eq(res.record.auto, false);
  const st = C.getStatus(s, t + 1000);
  eq(st.kind, 'settled');
  eq(C.todayEarned(st), res.record.total);
  eq(st.target, at(2026, 11, 6, 9));
  eq(C.clockOut(s, t + 2000), null);
});

test('撤销结算：回到待结算状态，心愿进度退回', () => {
  const s = make();
  s.overtime.mode = 'none';
  C.addWish(s, { name: 'A', budget: 10000 }, BASE);
  const t = at(2026, 11, 5, 18, 30);
  C.clockOut(s, t);
  near(s.wishes[0].saved, wage);
  C.reopenRecord(s, '2026-11-05');
  near(s.wishes[0].saved, 0);
  eq(C.getStatus(s, t + 1000).kind, 'overtime');
});

test('提前下班只计到点击时刻', () => {
  const s = make();
  const res = C.clockOut(s, at(2026, 11, 5, 13, 30));
  near(res.record.total, wage / 2);
  near(res.record.overtime, 0);
});

test('夜班跨零点：归属开始那天，凌晨仍在工作中', () => {
  const s = make();
  s.schedule.shifts[0] = { id: 'day', name: '夜班', start: '22:00', end: '06:00' };
  const st = C.getStatus(s, at(2026, 11, 6, 2));
  eq(st.kind, 'working');
  eq(st.inst.key, '2026-11-05');
  near(st.earn.total, wage / 2);
  eq(st.target, at(2026, 11, 6, 6));
  const out = C.getStatus(s, at(2026, 11, 6, 7));
  eq(out.kind, 'overtime');
  C.clockOut(s, at(2026, 11, 6, 7));
  eq(C.getStatus(s, at(2026, 11, 6, 8)).kind, 'before');
  eq(C.getStatus(s, at(2026, 11, 6, 8)).record.key, '2026-11-05');
});

test('周末和下一次上班时间', () => {
  const s = make();
  const st = C.getStatus(s, at(2026, 11, 7, 12));
  eq(st.kind, 'rest');
  eq(st.next.key, '2026-11-09');
  eq(st.target, at(2026, 11, 9, 9));
});

test('忘记点下班：超过时限自动补结算，只计正常工资并标记待核对', () => {
  const s = make();
  s.processedFrom = '2026-11-05';
  eq(C.autoSettle(s, at(2026, 11, 6, 1, 59)).length, 0);
  const done = C.autoSettle(s, at(2026, 11, 6, 2, 0));
  eq(done.length, 1);
  const r = done[0].record;
  eq(r.key, '2026-11-05');
  near(r.total, wage);
  near(r.overtime, 0);
  eq(r.auto, true);
  eq(r.clockOut, at(2026, 11, 5, 18));
  eq(C.unreviewedRecords(s).length, 1);
  C.markReviewed(s);
  eq(C.unreviewedRecords(s).length, 0);
});

test('程序关了好几天：打开时逐日补结算，而且不会重复', () => {
  const s = make();
  s.processedFrom = '2026-11-02';
  const done = C.autoSettle(s, at(2026, 11, 7, 12));
  eq(done.map((d) => d.record.key), ['2026-11-02', '2026-11-03', '2026-11-04', '2026-11-05', '2026-11-06']);
  eq(C.autoSettle(s, at(2026, 11, 7, 13)).length, 0);
});

test('首次使用当天之前的日子不会被补结算', () => {
  const s = C.normalizeState(null, at(2026, 11, 5, 12));
  s.salary.monthly = 8000;
  eq(C.autoSettle(s, at(2026, 11, 5, 12)).length, 0);
  eq(Object.keys(s.records).length, 0);
});

test('没填月薪时不补结算，填好后也不会补算之前的日子', () => {
  const s = make();
  s.salary.monthly = 0;
  s.processedFrom = '2026-11-02';
  eq(C.autoSettle(s, at(2026, 11, 6, 12)).length, 0);
  eq(Object.keys(s.records).length, 0);
  eq(s.processedFrom, '2026-11-05');
  s.salary.monthly = 8000;
  eq(C.autoSettle(s, at(2026, 11, 6, 12)).map((d) => d.record.key), ['2026-11-05']);
});

test('班次时长：普通班次和跨零点班次', () => {
  eq(C.shiftSeconds({ start: '09:00', end: '18:00' }), 9 * 3600);
  eq(C.shiftSeconds({ start: '22:00', end: '06:00' }), 8 * 3600);
});

test('下一班开始时，上一班即使未到时限也要自动结算', () => {
  const s = make();
  s.overtime.autoCloseHours = 24;
  s.processedFrom = '2026-11-05';
  eq(C.autoSettle(s, at(2026, 11, 6, 8, 59)).length, 0);
  eq(C.autoSettle(s, at(2026, 11, 6, 9)).length, 1);
  eq(C.getStatus(s, at(2026, 11, 6, 9)).inst.key, '2026-11-06');
});

test('修改下班时间：金额和心愿同步调整', () => {
  const s = make();
  C.addWish(s, { name: 'A', budget: 100000 }, BASE);
  s.processedFrom = '2026-11-05';
  C.autoSettle(s, at(2026, 11, 6, 2));
  near(s.wishes[0].saved, wage);
  const rev = C.reviseRecord(s, '2026-11-05', at(2026, 11, 5, 20), BASE);
  near(rev.record.overtime, ((wage / 9) * 1.5) * 2);
  near(s.wishes[0].saved, rev.record.total);
  eq(rev.record.auto, false);
  C.voidRecord(s, '2026-11-05');
  near(s.wishes[0].saved, 0);
  eq(C.monthStats(s, 2026, 10).attended, 0);
  eq(C.autoSettle(s, at(2026, 11, 6, 3)).length, 0);
});

test('心愿：按队列存入，溢出给下一个，全满进余额', () => {
  const s = make();
  C.addWish(s, { name: 'A', budget: 100 }, BASE);
  C.addWish(s, { name: 'B', budget: 200 }, BASE);
  const r1 = C.allocate(s, 150, BASE);
  eq(s.wishes.map((w) => w.saved), [100, 50]);
  eq(r1.filled.map((w) => w.name), ['A']);
  const r2 = C.allocate(s, 500, BASE);
  eq(s.wishes.map((w) => w.saved), [100, 200]);
  near(s.wishSurplus, 350);
  eq(r2.filled.map((w) => w.name), ['B']);
  const { wish } = C.addWish(s, { name: 'C', budget: 300 }, BASE);
  near(wish.saved, 300);
  near(s.wishSurplus, 50);
});

test('存入比例：只有设定比例的收入进心愿', () => {
  const s = make();
  s.wishShare = 25;
  s.overtime.mode = 'none';
  C.addWish(s, { name: 'A', budget: 100000 }, BASE);
  C.clockOut(s, at(2026, 11, 5, 18));
  near(s.wishes[0].saved, wage * 0.25);
});

test('调顺序：首位变化且原首位有进度时要询问', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const b = C.addWish(s, { name: 'B', budget: 100 }, BASE).wish;
  const c = C.addWish(s, { name: 'C', budget: 100 }, BASE).wish;
  a.saved = 40;
  const plan = C.planWishMove(s, c.id, 0);
  eq(plan.choice.subjectName, 'A');
  eq(plan.choice.targetName, 'C');
  near(plan.choice.amount, 40);
  eq(C.planWishMove(s, a.id, 0).changed, false);
  a.saved = 0;
  eq(C.planWishMove(s, c.id, 0).choice, null);
  eq(b.saved, 0);
});

test('调顺序：选择进度跟随原心愿', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const b = C.addWish(s, { name: 'B', budget: 100 }, BASE).wish;
  a.saved = 40;
  C.applyWishMove(s, b.id, 0, 'keep', BASE);
  eq(s.wishes.map((w) => w.name), ['B', 'A']);
  eq([b.saved, a.saved], [0, 40]);
  C.allocate(s, 10, BASE);
  eq([b.saved, a.saved], [10, 40]);
});

test('调顺序：选择把进度转给新首位', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const b = C.addWish(s, { name: 'B', budget: 100 }, BASE).wish;
  a.saved = 40;
  C.applyWishMove(s, b.id, 0, 'transfer', BASE);
  eq(s.wishes.map((w) => w.name), ['B', 'A']);
  eq([b.saved, a.saved], [40, 0]);
});

test('调顺序：转移金额超过新心愿预算时溢出给后面的心愿', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const b = C.addWish(s, { name: 'B', budget: 30 }, BASE).wish;
  a.saved = 80;
  const filled = C.applyWishMove(s, b.id, 0, 'transfer', BASE);
  eq(filled.map((w) => w.name), ['B']);
  eq([b.saved, a.saved], [30, 50]);
});

test('调顺序：把有进度的非首位心愿往后挪，也可以把进度交给接替者', () => {
  const s = make();
  C.addWish(s, { name: 'A', budget: 100 }, BASE);
  const b = C.addWish(s, { name: 'B', budget: 100 }, BASE).wish;
  const c = C.addWish(s, { name: 'C', budget: 100 }, BASE).wish;
  b.saved = 20;
  const plan = C.planWishMove(s, b.id, 2);
  eq(plan.choice.subjectName, 'B');
  eq(plan.choice.targetName, 'C');
  C.applyWishMove(s, b.id, 2, 'transfer', BASE);
  eq(s.wishes.map((w) => w.name), ['A', 'C', 'B']);
  eq([c.saved, b.saved], [20, 0]);
});

test('调顺序：把非首位往前挪但没动首位，不需要询问', () => {
  const s = make();
  C.addWish(s, { name: 'A', budget: 100 }, BASE);
  C.addWish(s, { name: 'B', budget: 100 }, BASE);
  const c = C.addWish(s, { name: 'C', budget: 100 }, BASE).wish;
  c.saved = 20;
  eq(C.planWishMove(s, c.id, 1).choice, null);
});

test('删除心愿：可以转给下一个，也可以直接清掉', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const b = C.addWish(s, { name: 'B', budget: 100 }, BASE).wish;
  a.saved = 40;
  C.removeWish(s, a.id, 'transfer', BASE);
  near(b.saved, 40);
  C.removeWish(s, b.id, 'drop', BASE);
  eq(s.wishes.length, 0);
  near(s.wishSurplus, 0);
});

test('编辑心愿：预算改小后多余的钱流向下一个，改大后回到队列', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const b = C.addWish(s, { name: 'B', budget: 100 }, BASE).wish;
  a.saved = 80;
  const filled = C.updateWish(s, a.id, { budget: 50 }, BASE);
  eq(filled.map((w) => w.name), ['A']);
  eq([a.saved, b.saved], [50, 30]);
  eq(C.filledWishes(s).length, 1);
  C.updateWish(s, a.id, { budget: 90 }, BASE);
  eq(C.filledWishes(s).length, 0);
  eq(a.filledAt, null);
  eq(C.activeWishes(s).length, 2);
});

test('实时预览不入账，今天的收入先算到首位心愿上', () => {
  const s = make();
  const a = C.addWish(s, { name: 'A', budget: 100 }, BASE).wish;
  const prev = C.previewWishes(s, 120);
  eq(prev.items[0].saved, 100);
  near(prev.surplus, 20);
  eq(a.saved, 0);
});

test('心愿预测：还需工作时长、班数和预计日期', () => {
  const s = make();
  s.salary.monthly = 2100; // 11 月 21 天，日薪 100，班次 9 小时
  C.addWish(s, { name: 'A', budget: 250 }, BASE);
  const now = at(2026, 11, 5, 9);
  const st = C.getStatus(s, now);
  const f = C.forecastWishes(s, now, st);
  const it = f.items[0];
  eq(it.reachable, true);
  near(it.workSeconds, 2.5 * 9 * 3600, 'work', 0.01);
  eq(it.shifts, 3);
  // 周四 周五 周一，第三班进行到一半
  eq(it.eta, at(2026, 11, 9, 13, 30));
});

test('心愿预测：工作中剩余时长每秒减少', () => {
  const s = make();
  s.salary.monthly = 2100;
  C.addWish(s, { name: 'A', budget: 250 }, BASE);
  const t1 = at(2026, 11, 5, 10);
  const t2 = t1 + 1000;
  const a = C.forecastWishes(s, t1, C.getStatus(s, t1)).items[0].workSeconds;
  const b = C.forecastWishes(s, t2, C.getStatus(s, t2)).items[0].workSeconds;
  near(a - b, 1, 'tick', 1e-6);
});

test('心愿预测：存入比例减半，时长翻倍', () => {
  const s = make();
  s.salary.monthly = 2100;
  s.wishShare = 50;
  C.addWish(s, { name: 'A', budget: 100 }, BASE);
  const now = at(2026, 11, 5, 9);
  near(C.forecastWishes(s, now, C.getStatus(s, now)).items[0].workSeconds, 2 * 9 * 3600, 'half', 0.01);
});

test('心愿预测：队列后面的心愿要累计前面的时长', () => {
  const s = make();
  s.salary.monthly = 2100;
  C.addWish(s, { name: 'A', budget: 100 }, BASE);
  C.addWish(s, { name: 'B', budget: 100 }, BASE);
  const now = at(2026, 11, 5, 9);
  const items = C.forecastWishes(s, now, C.getStatus(s, now)).items;
  near(items[0].workSeconds, 9 * 3600, 'A', 0.01);
  near(items[1].workSeconds, 18 * 3600, 'B', 0.01);
  eq(C.forecastWishes(s, now, C.getStatus(s, now), 1).items[1].reachable, false);
});

test('心愿预测：今天已结算时不再把今天算进去', () => {
  const s = make();
  s.salary.monthly = 2100;
  s.overtime.mode = 'none';
  C.addWish(s, { name: 'A', budget: 1000 }, BASE);
  C.clockOut(s, at(2026, 11, 5, 18));
  const now = at(2026, 11, 5, 18, 1);
  const it = C.forecastWishes(s, now, C.getStatus(s, now)).items[0];
  near(it.workSeconds, 9 * 9 * 3600, 'rest', 0.01);
});

test('心愿预测：按月排班时未排班的月份沿用最近的安排并标记估算', () => {
  const s = make();
  s.salary.monthly = 1000;
  s.schedule.mode = 'monthly';
  [3, 10, 17, 24].forEach((d) => C.toggleDay(s, new Date(2026, 10, d), 'day'));
  C.addWish(s, { name: 'A', budget: 600 }, BASE);
  const now = at(2026, 11, 1, 8);
  const it = C.forecastWishes(s, now, C.getStatus(s, now)).items[0];
  eq(it.reachable, true);

/* ---------- 一键核算 ---------- */
test('一键核算：5 号时从 1 号累计，没有记录的排班日按排班补算', () => {
  const s = makeLunch();
  s.processedFrom = '2026-11-05';
  s.overtime.mode = 'none';
  const now = at(2026, 11, 5, 13);
  const st = C.getStatus(s, now);
  const r = C.monthReckon(s, 2026, 10, now, st);
  eq(r.estimatedDays, 3); // 2、3、4 号
  near(r.estimated, wage * 3);
  near(r.live, hourly8 * 3); // 今天上午 3 小时
  near(r.settled, 0);
  near(r.total, wage * 3 + hourly8 * 3);
  eq(Object.keys(s.records).length, 0, 'does not write records');
});

test('一键核算：已结算用实际金额（含加班），事假和作废不补算', () => {
  const s = makeLunch();
  s.processedFrom = '2026-11-02';
  s.leave.personal = 0;
  C.clockOut(s, at(2026, 11, 2, 19)); // 2 号加班 1 小时
  C.clockOut(s, at(2026, 11, 3, 18));
  C.voidRecord(s, '2026-11-03');
  C.applyBrush(s, new Date(2026, 10, 4), brush('personal'), at(2026, 11, 4, 8));
  const now = at(2026, 11, 5, 8);
  const r = C.monthReckon(s, 2026, 10, now, C.getStatus(s, now));
  near(r.settled, wage + hourly8 * 1.5);
  near(r.estimated, 0);
  eq(r.estimatedDays, 0);
  near(r.total, wage + hourly8 * 1.5);
});

test('一键核算：带薪病假按比例补算，半天假按工时补算', () => {
  const s = makeLunch();
  s.processedFrom = '2026-11-05';
  s.leave.sick = 50;
  C.applyBrush(s, new Date(2026, 10, 2), brush('sick'), BASE);
  C.applyBrush(s, new Date(2026, 10, 3), brush('sick', 'am'), BASE);
  C.applyBrush(s, new Date(2026, 10, 4), { kind: 'off' }, BASE);
  const now = at(2026, 11, 5, 8);
  const r = C.monthReckon(s, 2026, 10, now, C.getStatus(s, now));
  // 4 号改成休息后当月 20 天，日薪变成 400，每小时 50
  near(r.estimated, 400 * 0.5 + (50 * 5 + 50 * 3 * 0.5));
  eq(r.estimatedDays, 2);
});

test('一键核算：过去的月份算整月，未来的月份是 0', () => {
  const s = makeLunch();
  const now = at(2026, 11, 5, 8);
  const st = C.getStatus(s, now);
  near(C.monthReckon(s, 2026, 9, now, st).total, 8000); // 10 月 22 天正好等于月薪
  near(C.monthReckon(s, 2026, 11, now, st).total, 0);
});

/* ---------- 兼容旧版存档 ---------- */
test('旧存档：没有午休和标记字段也能读，金额和之前一样', () => {
  const now = at(2026, 11, 6, 8);
  const old = {
    version: 1,
    createdAt: at(2026, 11, 5, 8),
    processedFrom: '2026-11-05',
    salary: { monthly: 8000, divisor: 'actual' },
    overtime: { mode: 'none', multiplier: 1.5, hourly: 50, autoCloseHours: 8 },
    schedule: {
      mode: 'weekly',
      shifts: [{ id: 'day', name: '白班', start: '09:00', end: '18:00' }],
      weekly: { 1: 'day', 2: 'day', 3: 'day', 4: 'day', 5: 'day' },
      monthly: {},
      exceptions: {},
    },
    records: {
      '2026-11-05': { key: '2026-11-05', shiftName: '白班', start: at(2026, 11, 5, 9), end: at(2026, 11, 5, 18), clockOut: at(2026, 11, 5, 18), wage, normal: wage, overtime: 0, otSeconds: 0, total: wage, auto: false, reviewed: true, voided: false, alloc: [] },
    },
    wishes: [],
    wishSurplus: 0,
    wishShare: 100,
    ui: { pinned: true, view: 'card', tab: 'settings', hideMoney: false, sound: true, trayHintShown: true },
  };
  const s = C.normalizeState(old, now);
  eq(s.schedule.shifts[0].breakStart, null);
  eq(s.schedule.marks, {});
  eq(s.leave, { holiday: 100, comp: 100, personal: 0, sick: 60 });
  eq(s.ui.yieldFullscreen, true);
  near(C.getStatus(s, at(2026, 11, 6, 13, 30)).earn.total, wage / 2);
  const rec = s.records['2026-11-05'];
  eq(rec.workSegs, [[at(2026, 11, 5, 9), at(2026, 11, 5, 18)]]);
  eq(rec.paidSeconds, 9 * 3600);
  near(C.reviseRecord(s, '2026-11-05', at(2026, 11, 5, 13, 30), now).record.total, wage / 2);
});

test('任务计时：开始、暂停、继续，暂停期间不计入耗时', () => {
  const s = makeLunch();
  const t = C.addTask(s, { name: '写周报' }, BASE);
  eq(t.status, 'planned');
  C.startTask(s, t.id, at(2026, 11, 5, 9));
  eq(C.taskStats(s, t, at(2026, 11, 5, 10)).seconds, 3600);
  C.pauseTask(s, t.id, at(2026, 11, 5, 10));
  eq(t.status, 'paused');
  eq(C.taskStats(s, t, at(2026, 11, 5, 11)).seconds, 3600);
  C.startTask(s, t.id, at(2026, 11, 5, 11));
  const live = C.taskStats(s, t, at(2026, 11, 5, 11, 30));
  eq(live.seconds, 5400);
  near(live.earned, hourly8 * 1.5);
});

test('任务计时：同一时间只计一个，开始新任务会暂停旧任务', () => {
  const s = makeLunch();
  const a = C.addTask(s, { name: 'A' }, BASE);
  const b = C.addTask(s, { name: 'B' }, BASE);
  C.startTask(s, a.id, at(2026, 11, 5, 9));
  C.startTask(s, b.id, at(2026, 11, 5, 10));
  eq([a.status, b.status], ['paused', 'running']);
  eq(C.taskStats(s, a, at(2026, 11, 5, 11)).seconds, 3600);
  eq(C.runningTask(s).id, b.id);
  C.pauseTask(s, b.id, at(2026, 11, 5, 11));
  eq(C.activeTask(s).id, b.id);
});

test('任务结算：耗时含午休，回报不含；之后改工资不影响记录；可撤销', () => {
  const s = makeLunch();
  const t = C.addTask(s, { name: 'A' }, BASE);
  C.startTask(s, t.id, at(2026, 11, 5, 11));
  const done = C.finishTask(s, t.id, at(2026, 11, 5, 14));
  eq(done.status, 'done');
  eq(done.seconds, 3 * 3600);
  eq(done.paidSeconds, 2 * 3600);
  near(done.earned, hourly8 * 2);
  s.salary.monthly = 1;
  near(C.taskStats(s, done, at(2026, 11, 6, 9)).earned, hourly8 * 2);
  eq(C.doneTasks(s, 2026, 10).length, 1);
  eq(C.doneTasks(s, 2026, 11).length, 0);
  C.reopenTask(s, t.id);
  eq(t.status, 'paused');
  eq(C.doneTasks(s, 2026, 10).length, 0);
  eq(C.finishTask(s, 'nope', BASE), null);
});

test('预约提醒：到点提醒开始，只提醒一次，不会自动开始', () => {
  const s = make();
  const t = C.addTask(s, { name: 'A', scheduledStart: at(2026, 11, 5, 15) }, BASE);
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 14, 59, 59)).reminders.length, 0);
  const r = C.dueTaskReminders(s, at(2026, 11, 5, 15));
  eq(r.reminders.map((x) => x.kind), ['start']);
  eq(r.changed, true);
  eq(t.status, 'planned');
  const again = C.dueTaskReminders(s, at(2026, 11, 5, 15, 1));
  eq(again.reminders.length, 0);
  eq(again.changed, false);
});

test('预约提醒：结束前 5 分钟和结束时各提醒一次', () => {
  const s = make();
  const t = C.addTask(s, { name: 'A', scheduledStart: at(2026, 11, 5, 15), scheduledEnd: at(2026, 11, 5, 16) }, BASE);
  C.startTask(s, t.id, at(2026, 11, 5, 15));
  C.dueTaskReminders(s, at(2026, 11, 5, 15));
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 15, 54, 59)).reminders.length, 0);
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 15, 55)).reminders.map((x) => x.kind), ['ending']);
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 15, 56)).reminders.length, 0);
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 16)).reminders.map((x) => x.kind), ['end']);
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 16, 1)).reminders.length, 0);
  eq(t.status, 'running');
});

test('预约提醒：暂停中也提醒结束，没开始或已结算不提醒结束', () => {
  const s = make();
  const a = C.addTask(s, { name: 'A', scheduledEnd: at(2026, 11, 5, 16) }, BASE);
  C.startTask(s, a.id, at(2026, 11, 5, 15));
  C.pauseTask(s, a.id, at(2026, 11, 5, 15, 30));
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 16)).reminders.map((x) => x.kind), ['end']);
  const b = C.addTask(s, { name: 'B', scheduledEnd: at(2026, 11, 5, 17) }, BASE);
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 17)).reminders.length, 0);
  C.startTask(s, b.id, at(2026, 11, 5, 16, 30));
  C.finishTask(s, b.id, at(2026, 11, 5, 16, 40));
  eq(C.dueTaskReminders(s, at(2026, 11, 5, 17)).reminders.length, 0);
});

test('预约提醒：错过超过 1 小时不补提醒，改时间后重新提醒', () => {
  const s = make();
  const t = C.addTask(s, { name: 'A', scheduledStart: at(2026, 11, 5, 9) }, BASE);
  const r = C.dueTaskReminders(s, at(2026, 11, 5, 12));

});

test('预约提醒：提前开始就不再提醒开始', () => {

  const t = C.addTask(s, { name: 'A', scheduledStart: at(2026, 11, 5, 15) }, BASE);
  C.startTask(s, t.id, at(2026, 11, 5, 14));

test('读档：任务能原样读回，旧存档没有任务也能读', () => {
  const s = makeLunch();
  const a = C.addTask(s, { name: 'A', scheduledStart: at(2026, 11, 5, 9), scheduledEnd: at(2026, 11, 5, 10) }, BASE);
  const b = C.addTask(s, { name: 'B' }, BASE);
  C.startTask(s, a.id, at(2026, 11, 5, 9));
  C.finishTask(s, a.id, at(2026, 11, 5, 10));
  C.startTask(s, b.id, at(2026, 11, 5, 10));
  s.ui.strip = 'task';
  eq(C.normalizeState(JSON.parse(JSON.stringify(s)), BASE), s);
  const old = JSON.parse(JSON.stringify(s));
  delete old.tasks;
  delete old.ui.strip;
  const loaded = C.normalizeState(old, BASE);
  eq(loaded.tasks, []);
  eq(loaded.ui.strip, 'wish');
});

test('读档：非法任务被丢弃，状态和计时段被纠正', () => {
  const now = at(2026, 11, 5, 12);
  const s = C.normalizeState({
    tasks: [
      'junk',
      { name: '没有 id' },
      { id: 'a', name: 'x'.repeat(99), status: 'evil' },
      { id: 'b', status: 'running', segments: [[1, null]] },
      { id: 'c', status: 'running', segments: [[2, null]] },
      { id: 'd', status: 'running', segments: [] },
      { id: 'e', status: 'paused', segments: [[3, null], ['x', 1]] },
      { id: 'f', status: 'done', segments: [] },
    ],
  }, now);
  eq(s.tasks.map((t) => t.id), ['a', 'b', 'c', 'd', 'e', 'f']);
  eq(s.tasks[0].status, 'planned');
  eq(s.tasks[0].name.length, 40);
  eq(s.tasks.filter((t) => t.status === 'running').map((t) => t.id), ['b']);
  eq(s.tasks[2].segments, [[2, 2]]);
  eq(s.tasks[3].status, 'planned');
  eq(s.tasks[4].segments, [[3, 3]]);
  eq(s.tasks[5].status, 'planned');
});
